# SiteMaster configuration.
# Every environment-specific value can be overridden with an environment variable;
# the value after the colon is the localhost default.

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: SITEMASTER_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

spring:
  application:
    name: sitemaster
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sitemaster}
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
      # DTOs are validated by Spring MVC; entity validation on flush is not used.
      jakarta.persistence.validation.mode: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: ${APP_TIME_ZONE:Asia/Colombo}
    serialization:
      write-dates-as-timestamps: false
  messages:
    basename: ValidationMessages,messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:60MB}

app:
  upload-dir: ${UPLOAD_DIR:${user.home}/sitemaster-uploads}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  security:
    max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}
    lock-duration: ${LOCK_DURATION:15m}
    reset-token-expiry: ${RESET_TOKEN_EXPIRY:30m}
  files:
    image-max-size: ${IMAGE_MAX_SIZE:2MB}
    document-max-size: ${DOCUMENT_MAX_SIZE:10MB}
  seed:
    enabled: ${SEED_ENABLED:true}
    default-password: ${SEED_PASSWORD:Password@123}

logging:
  level:
    com.sitemaster: INFO
